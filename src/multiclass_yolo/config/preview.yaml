multiclass_yolo:
  ros__parameters:
    input_format: nv12
    inference_backend: TENSORRT
    engine_precision: fp16
    width: 1280
    height: 800
    sensor_fps: 30.0
    undistort_enabled: true
    frame_timeout_sec: 5.0
    tensorrt_workspace_size_mb: 1024
    nms_threshold: 0.65
    con_threshold: 0.25
    truck_threshold: 0.25
    sedan_threshold: 0.25
    traffic_light_threshold: 0.25
