multiclass_yolo:
  ros__parameters:
    input_format: nv12
    inference_backend: TENSORRT
    engine_precision: fp16
    measurement_seconds: 15
    width: 1280
    height: 800
    sensor_fps: 40.0
    depth_fusion_enabled: true
    fusion_sync_ms: 20.0
    roi_height_percent: 65
    undistort_enabled: true
    frame_timeout_sec: 5.0
    tensorrt_workspace_size_mb: 1024
    nms_threshold: 0.65
    con_threshold: 0.70
    truck_threshold: 0.70
    sedan_threshold: 0.70
    traffic_light_threshold: 0.70
