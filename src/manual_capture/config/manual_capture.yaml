manual_capture:
  ros__parameters:
    # Empty: first OAK found. The startup measurement then reopens that device.
    device_id: ""

    # --- restart-required (also editable in the GUI) ---
    rgb_width: 1280
    rgb_height: 800
    rgb_fps: 30.0
    rgb_format: "NV12"          # NV12 or RGB888
    rgb_undistort: true         # required for a metric color BEV
    stereo_width: 1280
    stereo_height: 800
    stereo_fps: 30.0            # <= 50 with both lenses + stereo depth
    stereo_mode: "left_right"   # left_right, or left_only (left-lens BEV, right lens locked)
    virtual_camera_position_ratio: 0.5   # 0=LEFT, 0.5=midpoint, 1=RIGHT
    sync_threshold_ms: 2.0

    # --- live controls (initial values) ---
    rgb_auto_exposure: true
    rgb_exposure_us: 8000
    rgb_iso: 400
    stereo_auto_exposure: false
    stereo_exposure_us: 5000
    stereo_iso: 800
    # IR flood always starts at 0. The dot projector is automatic: ON only while
    # the center view is previewed (disparity) or during Refit, at this intensity.
    dot_projector_intensity: 1.0

    # --- BEV (shared vehicle grid; color and left-lens BEVs are pixel aligned) ---
    # Vehicle frame: origin = front-axle ground center, +X forward, +Y left.
    # Mount pose matches auto_control (bev_processor/config/bev_config.yaml):
    # the camera optical center is 9 cm behind the front axle. The launch file
    # copies camera_x/y/yaw from that file when bev_processor is installed.
    bev.camera_x_m: -0.09
    bev.camera_y_m: 0.0
    bev.camera_yaw_deg: 0.0
    bev.x_min_m: 0.0
    bev.x_max_m: 3.0
    bev.y_min_m: -0.6
    bev.y_max_m: 0.6
    bev.meter_per_pixel: 0.01
    bev.output_width: 120
    bev.output_height: 300
    # Fixed pose used until the first successful ground measurement.
    bev.default_camera_height_m: 0.20
    bev.default_camera_roll_deg: 0.0
    bev.default_camera_pitch_down_deg: 14.0
    bev.startup_measurement_enabled: true

    # Ground measurement (startup + Refit), same algorithm as oak_startup.
    measurement_attitude_source: "depth"
    measurement_stereo_fps: 30.0
    measurement_warmup_sec: 2.0
    measurement_timeout_sec: 45.0
    measurement_ir_dot_projector_intensity: 1.0
    measurement_manual_camera_height_enabled: false
    measurement_manual_camera_height_m: 0.20
    measurement_roi_width: 456
    measurement_roi_height: 228
    measurement_roi_vertical_offset_px: 80
    measurement_minimum_valid_points: 5080
    measurement_minimum_height_m: 0.10
    measurement_maximum_height_m: 0.40

    # --- capture ---
    # Launch sets capture_root to <workspace>/captures unless overridden.
    jpeg_quality: 95
    writer_queue_events: 64
    auto_capture_fps: 5.0
    camera_preview_fps: 15
    bev_preview_fps: 10

    # --- vehicle ---
    capture_button_index: 0     # A (SDL GameController)
    # measured_erpm_topic / servo_position_topic / vehicle_acceleration_topic are set
    # by the launch file from vehicle_namespace (/<ns>/vesc/..., /<ns>/vehicle/dynamics/...).
    refit_maximum_abs_erpm: 100
    erpm_timeout_sec: 1.0

    # --- IMU pitch/roll correction of the BEVs (same estimator/values as auto_control) ---
    # The measured ground pose (startup/Refit) is the reference; per frame the BEV is
    # corrected by the IMU tilt relative to it. After startup/Refit the vehicle must
    # stay still ~5 s (1 s discard + 4 s calibration); until then the fixed pose is used.
    # Raw color/stereo images are never warped.
    imu_stabilization.enabled: true
    imu_stabilization.imu_rate_hz: 200.0
    imu_stabilization.imu_queue_size: 80
    imu_stabilization.imu_max_batch_reports: 5
    imu_stabilization.maximum_accel_gyro_timestamp_skew_sec: 0.003
    imu_stabilization.startup_discard_duration_sec: 1.0
    imu_stabilization.reference_calibration_duration_sec: 4.0
    imu_stabilization.calibration_maximum_angular_speed_degps: 0.5
    # Standstill from measured ERPM (filtered entry, raw exit).
    imu_stabilization.stationary_erpm_enter_threshold: 100
    imu_stabilization.stationary_erpm_exit_threshold: 500
    imu_stabilization.stationary_erpm_filter_time_constant_sec: 0.15
    imu_stabilization.stationary_erpm_enter_duration_sec: 1.0
    imu_stabilization.measured_erpm_timeout_sec: 1.0
    # Vehicle acceleration from vehicle_dynamics_monitor removed from the accelerometer.
    imu_stabilization.vehicle_motion_compensation_enabled: true
    imu_stabilization.can_acceleration_timeout_sec: 0.10
    imu_stabilization.can_longitudinal_compensation_gain: 1.0
    imu_stabilization.can_lateral_compensation_gain: 1.0
    # Camera ahead of the rotation center (rear axle): wheelbase 0.33 + camera x -0.09.
    imu_stabilization.lever_arm_m: 0.24
    imu_stabilization.accelerometer_time_constant_sec: 1.5
    imu_stabilization.accelerometer_direction_gate_deg: 4.3
    imu_stabilization.roll_accelerometer_time_constant_sec: 2.0
    imu_stabilization.roll_accelerometer_direction_gate_deg: 4.3
    imu_stabilization.accelerometer_stationary_only: false
    imu_stabilization.moving_accelerometer_nudge_enabled: true
    imu_stabilization.moving_accelerometer_nudge_strength: 0.15
    imu_stabilization.moving_gravity_anchor_maximum_correction_rate_degps: 0.50
    imu_stabilization.reference_tilt_leak_time_constant_sec: 4.0
    imu_stabilization.pitch_correction_enabled: true
    imu_stabilization.roll_correction_enabled: true
    imu_stabilization.gyroscope_correction_gain: 1.0
    imu_stabilization.maximum_correction_deg: 3.0
    imu_stabilization.maximum_frame_imu_wait_sec: 0.005
    imu_stabilization.maximum_frame_imu_age_sec: 0.012
    imu_stabilization.maximum_prediction_sec: 0.015
    # /camera/imu (camera_optical_frame) for vehicle_dynamics_monitor's yaw rate, as
    # camera_driver publishes it in auto_control. The OAK is owned by this node.
    imu_bridge_enabled: true
    imu_topic: "/camera/imu"
    imu_frame_id: "camera_optical_frame"
