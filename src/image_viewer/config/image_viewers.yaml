# 각 항목은 독립된 image_viewer 노드 프로세스로 실행된다.
viewer_1:
  ros__parameters:
    image_topic: "/camera/image_raw"
    preview_fps: 15.0
    window_name: "viewer_1 - camera raw"
    fit_to_image: true
    max_window_width: 1280
    max_window_height: 720
    # fit_to_image가 false일 때만 아래 고정 크기를 사용한다.
    window_width: 640
    window_height: 480
    no_frame_timeout_sec: 3.0

viewer_2:
  ros__parameters:
    # normal_image_publisher_node가 발행하는 일반/왜곡 보정 영상.
    image_topic: "/image/normal"
    preview_fps: 10.0
    window_name: "viewer_2 - normal"
    fit_to_image: true
    max_window_width: 1280
    max_window_height: 720
    window_width: 640
    window_height: 480
    no_frame_timeout_sec: 3.0

viewer_3:
  ros__parameters:
    # image_processor 구현 후 실제 디버그 토픽 이름에 맞게 변경한다.
    image_topic: "/image/debug"
    preview_fps: 10.0
    window_name: "viewer_3 - debug"
    fit_to_image: true
    max_window_width: 1280
    max_window_height: 720
    window_width: 640
    window_height: 480
    no_frame_timeout_sec: 3.0
