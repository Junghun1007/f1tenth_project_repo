bev_processor:
  ros__parameters:
    # YAML이 빠지거나 노드명이 맞지 않을 때 C++ 기본값으로 조용히 실행되는 것을 막는다.
    configuration_version: 1

    # true면 GUI 프리뷰를 강제로 끄고 흔들림 보정 입력부터 BEV 발행까지의
    # FPS·지연·CUDA 처리 시간을 상태 로그 주기마다 출력한다.
    performance_measurement_enabled: false

    # camera_driver가 하단 crop NV12와 같은 프레임의 보정 행렬을 함께 보낸다.
    # CUDA가 이 보정과 고정 BEV LUT를 한 번의 sampling으로 합성한다.
    input_topic: "/camera/bev_input"
    output_topic: "/camera/image_bev"
    output_frame_id: "front_axle_bev"
    # Latched startup ground normal shared with camera_driver.
    startup_ground_reference_topic: "/camera/startup_ground_normal"
    startup_ground_reference_frame_id: "camera_optical_frame"
    expected_input_fps: 80.0
    # 0.70이면 1280x720의 하단 504행. 통합 launch에서 카메라와 같이 바뀐다.
    input_bottom_fraction: 0.70

    # publish_max_fps가 0이면 처리된 프레임을 별도 속도 제한 없이 발행한다.
    publish_enabled: true
    publish_max_fps: 0.0
    preview_enabled: true
    preview_max_fps: 60.0
    preview_window_name: "BEV image"
    preview_max_width: 1280
    preview_max_height: 720

    # 고정 BEV LUT가 가정하는 가상 안정화 영상의 유효 내부 파라미터다.
    # camera_config.yaml의 fixed_view_zoom=1.25가 fx/fy에 반영된 값이며,
    # 프레임별 역행렬이 이 좌표를 하단 raw crop 좌표로 다시 매핑한다.
    input_width: 1280
    input_height: 720
    fx: 701.751174926
    fy: 701.420440674
    cx: 643.032653809
    cy: 352.621124268

    # 차량 좌표계: 원점=앞차축 지면 중심, +X=전방, +Y=좌측, +Z=상방.
    # X/Y와 yaw는 시작 측정으로 구하지 않으므로 실제 장착 위치를 직접 잰다.
    # 자동 모드에서는 높이·roll·하향 pitch를 아래 시작 depth 노면 측정에서 구한다.
    # 수동 높이 모드에서는 높이는 지정값, roll/pitch는 IMU 측정값을 사용한다.
    camera_x_m: 0.02
    camera_y_m: 0.0
    camera_yaw_deg: 0.0

    # true면 depth 평면 측정과 IR projector를 사용하지 않고 지정 높이를 쓴다.
    # 이 경우에도 roll/pitch를 위한 초기 IMU 안정화는 그대로 수행한다.
    # 실제 장착 높이를 지면에서 카메라 광학 중심까지 수직으로 측정해 입력한다.
    manual_camera_height_enabled: false
    manual_camera_height_m: 0.20

    # 수동 높이가 꺼진 경우 시작 시 한 번만 높이·roll·pitch를 측정한다.
    # 중앙 ROI에 장애물 없이 평평한 노면만 보이게 하고 차량을 정지시킨다.
    # 측정 성공 후 이 자세로 LUT를 한 번 생성하며 주행 중에는 갱신하지 않는다.

    # 시작 시 한 번만 측정하므로 속도보다 depth 정밀도를 우선한다.
    measurement_stereo_fps: 30.0
    measurement_stereo_width: 1280
    measurement_stereo_height: 800
    # 작은 depth queue는 오래된 프레임 누적을 줄인다. 처리 누락이 반복될 때만 늘린다.
    measurement_depth_queue_size: 2
    # 5-bit subpixel 정밀도를 유지한다. RVC2는 disparity shift 사용 시 RGB depth
    # alignment를 지원하지 않으므로 CAM_A/IMU 좌표 일치를 위해 shift는 반드시 0이다.
    measurement_stereo_subpixel_fractional_bits: 5
    measurement_stereo_left_right_check_threshold: 5
    # FAST_ACCURACY 기본값과 같은 55: 낮을수록 부정확한 disparity를 더 엄격히 제거한다.
    measurement_stereo_confidence_threshold: 55
    measurement_stereo_disparity_shift: 0

    # IMU rate는 실제 OAK IMU 지원 속도로 정한다. sample_count/rate가 평균 시간이다.
    # calibrated accel/gyro를 동시에 받아 정지 상태를 확인한다.
    measurement_imu_rate_hz: 400.0
    measurement_imu_queue_size: 200
    measurement_imu_max_batch_reports: 5
    measurement_maximum_imu_pair_skew_sec: 0.003
    # 전원 인가 직후 stereo 노출과 IMU 과도값을 버리는 시간이다.
    measurement_warmup_sec: 2.0

    # Pro 모델의 IR dot projector 세기: 0.0=끔, 1.0=최대.
    # 자동 depth 높이 측정에만 사용하며 수동 높이 모드에서는 켜지 않는다.
    measurement_ir_dot_projector_intensity: 1.0

    # 영상 중앙에서 평평한 노면만 포함하도록 ROI를 정한다.
    # 너무 크면 차체·벽·장애물이 섞이고, 너무 작으면 평면 포인트가 부족해진다.
    measurement_roi_width: 456
    measurement_roi_height: 228
    # 1은 모든 픽셀, 2는 가로·세로 한 칸씩 건너뛴다. 작을수록 정확하지만 느리다.
    measurement_point_sample_step: 2
    # 유효 포인트 최소값은 ROI와 sample_step을 바꿀 때 함께 비례 조정한다.
    # 지나치게 낮추면 sparse depth를 정상 노면으로 오인할 수 있다.
    measurement_minimum_valid_points: 5080

    # ROI에서 실제 노면까지 관측되는 depth 범위를 포함하도록 정한다.
    # 범위가 너무 넓으면 장애물이, 너무 좁으면 정상 노면이 제외될 수 있다.
    measurement_minimum_depth_m: 0.30
    measurement_maximum_depth_m: 3.00
    # 줄자로 예상한 실제 카메라 높이를 여유 있게 감싸는 안전 범위다.
    # 예: 실제 높이가 약 0.17m이면 0.10~0.30m처럼 좁히면 오검출 방지에 유리하다.
    measurement_minimum_height_m: 0.10
    measurement_maximum_height_m: 0.40

    # 한 depth 프레임의 노면 평면을 RANSAC으로 찾는다.
    # 반복 수가 많을수록 outlier에 강하지만 시작 시간이 늘어난다.
    measurement_plane_ransac_iterations: 200
    # 포인트와 평면의 허용 거리다. 0.008은 8mm이다.
    # 거친 노면에서 계속 실패할 때만 0.010~0.015m 정도로 조금씩 완화한다.
    measurement_plane_inlier_threshold_m: 0.008
    # 최소 inlier 개수는 ROI/sample_step 변경 비율에 맞춰 조정한다.
    measurement_plane_minimum_inliers: 3656
    # 유효 포인트 중 평면에 속해야 하는 최소 비율이다. 낮추면 장애물 오검출 위험이 커진다.
    measurement_plane_minimum_inlier_ratio: 0.70
    # inlier 잔차의 MAD 한계다. 평탄한 바닥은 작게, 거친 바닥은 로그를 보고 소폭 늘린다.
    measurement_plane_maximum_residual_mad_m: 0.005
    # depth 평면 법선과 IMU 중력 방향이 이 각도보다 다르면 잘못된 평면으로 본다.
    measurement_plane_maximum_imu_difference_deg: 5.0

    # BEV 절대 roll/pitch는 실제 노면 평면 법선에서 구한다.
    # IMU는 노면 후보 검증과 정지 상태 판정에만 사용한다.
    measurement_attitude_source: "depth"

    # IMU 장착 bias = IMU 측정값 - 신뢰하는 실제값. "imu" 선택 시 최종
    # roll/pitch에 적용되며, "depth" 선택 시에도 노면 평면 검증 기준에 적용된다.
    # 평평한 기준면에서 반복 측정한 일정한 편차가 확인되기 전에는 0을 유지한다.
    # 예: IMU pitch=18.8도, 실제 pitch=13.0도이면 pitch bias=+5.8도이다.
    measurement_imu_roll_bias_deg: 0.0
    measurement_imu_pitch_bias_deg: 0.0

    # sample_count/rate가 IMU 평균 시간이다. 1200/400 = 3초이다.
    measurement_imu_sample_count: 1200
    # 정지 중 중력 방향 RMS 한계다. 실패하면 차량 진동·바닥 흔들림부터 확인한다.
    measurement_imu_max_direction_rms_deg: 0.50
    # 정지 상태에서 가속도 크기는 중력가속도 9.81m/s² 근처여야 한다.
    # 이 범위를 벗어나면 이동·충격·센서 이상으로 보고 측정을 받지 않는다.
    measurement_imu_accel_min_mps2: 8.30
    measurement_imu_accel_max_mps2: 11.30
    measurement_imu_gyroscope_mean_maximum_degps: 0.80
    measurement_imu_gyroscope_stddev_maximum_degps: 1.40

    # 연속된 평면 여러 장의 높이와 법선이 안정적일 때만 최종값을 채택한다.
    # 30FPS에서 45프레임은 약 1.5초이다.
    measurement_stable_plane_frame_count: 45
    # origin 방식의 depth 평면 offset 높이 표준편차 3mm를 허용한다.
    # 반복 실패 시 ROI와 정지 상태를 먼저 확인한 뒤 조금씩 완화한다.
    measurement_maximum_height_stddev_m: 0.003
    measurement_maximum_plane_normal_rms_deg: 0.25
    # 워밍업+IMU 평균+평면 수집을 모두 포함한 전체 제한시간이다.
    measurement_timeout_sec: 45.0

    # BEV 영상 위쪽이 차량 전방, 영상 왼쪽이 차량 좌측이다.
    x_min_m: 0.0
    x_max_m: 3.0
    y_min_m: -0.6
    y_max_m: 0.6
    meter_per_pixel: 0.01

    # output_width  = round((y_max_m - y_min_m) / meter_per_pixel)
    # output_height = round((x_max_m - x_min_m) / meter_per_pixel)
    output_width: 120
    output_height: 300

    # 원본 컬러 BEV(/camera/image_bev)는 그대로 유지하고, 이 단계를 켜면
    # 검은 배경+흰 주행 중심선인 mono8 결과를 lane_output_topic으로 발행한다.
    lane_reconstruction_enabled: true
    lane_output_topic: "/camera/image_bev_lane"
    # true면 프리뷰에서 실제 왼쪽/오른쪽 경계를 파랑/빨강, 주행 중심선을
    # 노랑으로 합성한다.
    # false면 필터를 적용하지 않은 원본 BEV를 표시한다. 두 발행 토픽은 불변이다.
    lane_preview_enabled: true
    # true면 실제 좌/우 회전형 검색 윈도우를 1px 박스로 프리뷰에 표시한다.
    lane_preview_sliding_windows_enabled: false
    # 차량 좌표 X=0.02m에 있는 카메라 위치를 프리뷰 X=0으로 표기한다.
    preview_x_origin_m: 0.02
    # 중심선 결과 영상의 좌우에 각각 70cm 검은 공간을 둔다. 원본 컬러
    # BEV는 중앙에 유지되며, 화면 밖으로 추론된 차선도 이 공간에 그린다.
    lane_output_lateral_margin_m: 0.70
    # 0은 투명, 1은 불투명이다. 기본값은 형광펜처럼 원본이 비치는 값이다.
    lane_preview_overlay_alpha: 0.8

    # 밝기(Y에 가까운 grayscale)를 기본으로 사용한다. 1.3m까지는 near
    # 임계값을 쓰고 그 이후에는 원거리 번진 픽셀을 잃지 않도록 far 값까지
    # 선형으로 낮춘다. 낮은 saturation은 흰색/회색만 남겨 컬러 풍경을 거른다.
    lane_minimum_brightness: 160
    lane_far_minimum_brightness: 110
    lane_maximum_saturation: 80
    # 1은 추가 블러 없음. 원거리의 얇은 픽셀을 보존하는 기본값이다.
    lane_brightness_blur_kernel: 1
    lane_vertical_close_m: 0.05
    lane_minimum_mark_width_m: 0.015 # 0.01
    # 최초 seed는 어두운 배경 위의 3cm 이하 흰 선만 허용한다.
    lane_maximum_mark_width_m: 0.030
    # 선 중심과 양옆 4cm 배경의 밝기 차가 40 이상이어야 하며,
    # 양옆 배경 평균이 140보다 밝으면 도로 밖 밝은 풍경으로 보고 제외한다.
    lane_minimum_local_contrast: 55
    lane_maximum_local_background_brightness: 140
    lane_local_background_band_m: 0.04 # 0.05
    # 추적 중에는 윈도우의 모든 밝은 픽셀을 평균하지 않는다. 가로 방향으로
    # 분리한 밝은 덩어리 중 예측점에 가깝고 이 폭 이하인 하나만 실측한다.
    # 먼 차선은 BEV 번짐을 고려하여 최대 22cm까지 점진적으로 허용한다.
    lane_tracked_mark_width_near_m: 0.11
    lane_tracked_mark_width_far_m: 0.22
    # 갑자기 옆 풍경으로 이동하지 않도록 실측점의 횡방향 이동을 제한한다.
    lane_measurement_lateral_gate_near_m: 0.05
    lane_measurement_lateral_gate_far_m: 0.10
    lane_row_step_px: 2

    # 1.3m는 관측 차단점이 아니라 원거리 완화를 시작하는 지점이다.
    # 이후에는 더 낮은 밝기 임계값과 넓은 윈도우로 실제 픽셀을 계속 찾는다.
    lane_observation_minimum_x_m: 0.20 # 0.20
    lane_observation_maximum_x_m: 1.30
    lane_reconstruction_minimum_x_m: 0.10 # 0.20
    lane_reconstruction_maximum_x_m: 3.0 # 2.70
    # 마지막 실측점 이후에는 추가 예측 선을 그리지 않는다.
    lane_maximum_extrapolation_m: 0.0

    # 회전형 슬라이딩 윈도우. 예측은 다음 검색 위치에만 사용하고, 픽셀이
    # 있으면 측정값 88%로 위치를 보정한다. 먼 곳의 창은 번짐을
    # 포함하도록 원거리에서 반폭 14cm까지 넓어진다.
    lane_sliding_window_step_m: 0.04 # 0.06
    lane_sliding_window_length_m: 0.18
    lane_sliding_window_half_width_near_m: 0.08
    lane_sliding_window_half_width_far_m: 0.14
    lane_sliding_window_measurement_weight: 0.88
    lane_sliding_window_heading_weight: 0.50
    lane_maximum_tracking_arc_length_m: 3.20
    # 4개 정도의 창이 비어도 다시 픽셀을 찾으면 추적을 이어간다.
    lane_maximum_tracking_gap_m: 0.16
    lane_maximum_gap_fill_m: 0.30
    # 현재 실측점 70%, 앞뒤 실측점 각각 15%로 국소 평활화한다.
    lane_measured_point_smoothing_weight: 0.70
    lane_minimum_window_pixel_count: 6

    # 설정 차선 폭 65cm ± 8cm, 즉 57~73cm를 정상 좌·우 차선 쌍으로 본다.
    # 양쪽이 보이면 설정 폭이 아니라 두 실측 경계 대응점의 중점을 사용한다.
    # 한쪽만 보일 때는 이 값의 절반인 32.5cm를 사용한다.
    lane_expected_width_m: 0.65
    lane_width_tolerance_m: 0.08
    lane_initial_center_tolerance_m: 0.60
    # 한 선을 좌/우 양쪽으로 동시에 해석하지 않도록 단일 경계에서 계산한
    # 도로 중심이 차량 중심으로부터 20cm 안에 있을 때만 채택한다.
    lane_single_initial_tolerance_m: 0.20
    lane_minimum_points: 6
    # 반대편 실선이 법선거리 폭 검증을 통과하면 3개 실측점부터
    # 전체 가상선으로 덮어쓰지 않고 짧은 실제 차선으로 유지한다.
    lane_minimum_counterpart_points: 3
    lane_allow_single_lane: true

    # 한쪽만 검출되어도 그 실측 경계에서 폭의 절반만큼 이동해 중심선을 만든다.
    # 반대편 가상 차선은 생성하지 않는다.
    lane_centerline_from_single_boundary_enabled: true
    # 양쪽 실측 경계의 수직 대응점 중점을 국소 평활화한다.
    # 0.65는 현재 중점 65%, 앞뒤 중점 각 17.5%이다.
    lane_centerline_midpoint_smoothing_weight: 0.65
    # 양쪽이 연속 검출될 때 현재 프레임 72%, 직전 중앙선 28%만 섞는다.
    lane_centerline_temporal_current_weight: 0.72
    # 양쪽→한쪽 전환 첫 프레임에서 기존 중앙선과의 Y 차이를
    # 최대 15cm까지 일시 보정하고, 매 프레임 70%만 남겨 제거한다.
    lane_centerline_transition_maximum_correction_m: 0.15
    lane_centerline_transition_correction_decay: 0.70
    # false면 매 프레임 현재 경계의 접선에 수직인 방향으로 32.5cm 옮긴다.
    # true는 동일-X 횡방향 이동이며 기본 주행에는 권장하지 않는다.
    lane_centerline_preserve_reference_shape: false
    # preserve_reference_shape=false인 법선 중심선 계산에 아래 세 값을 사용한다.
    # 20cm 범위의 여러 기준점으로 접선을 계산한다.
    # 접선은 곡률 1.25(최소 회전반경 약 0.8m), 점별 8도를 모두
    # 넘지 않게 제한해 짧은 노이즈가 법선 위치를 크게 흔드는 것을 막는다.
    # 급커브 법선 오프셋이 접히면 동일-X 평행이동으로 바꾸지 않고,
    # 기준선과 같은 방향으로 진행하는 가장 긴 유효 구간만 출력한다.
    lane_centerline_tangent_window_m: 0.20
    lane_centerline_maximum_curvature_per_m: 1.25
    lane_centerline_maximum_heading_step_deg: 8.0

    # 화면 표시는 이전 차량 좌표의 라인을 재사용하지 않고 매 프레임
    # 현재 픽셀로 다시 계산한다. 이로써 차량 회전 시 stale hold를 막는다.
    lane_temporal_tracking_enabled: false
    lane_temporal_maximum_lateral_jump_near_m: 0.06
    lane_temporal_maximum_lateral_jump_far_m: 0.12
    lane_temporal_maximum_heading_jump_deg: 15.0
    # 다른 밝은 경계로 크게 점프한 결과는 4프레임 연속 확인된 뒤 승인한다.
    lane_temporal_confirmation_frames: 4
    lane_temporal_hold_frames: 0

    # 1cm/pixel인 기본 BEV에서 약 2pixel 두께다.
    lane_output_line_thickness_m: 0.02

    status_log_interval_sec: 5.0
    startup_timeout_sec: 12.0
    # camera_driver의 기존 1초 폐기+4초 기준 측정은 그대로 두고,
    # 이 기간의 안정화 전 영상을 BEV 출력에서만 제외한다.
    stabilization_settle_sec: 5.5
