bev_processor:
  ros__parameters:
    # camera_driver publishes rectified CAM_A frames in raw NV12 layout.
    input_topic: "/camera/image_rect"
    output_topic: "/camera/image_bev"
    output_frame_id: "front_axle_bev"
    expected_input_fps: 120.0

    # Every accepted input is processed on CUDA. Publishing is unlimited by
    # default, while the independent OpenCV preview is limited to 30 FPS.
    publish_enabled: true
    publish_max_fps: 0.0
    preview_enabled: true
    preview_max_fps: 30.0
    preview_window_name: "BEV image"
    preview_max_width: 1280
    preview_max_height: 720

    # K_rect reported by camera_driver for the rectified 1280x720 output.
    input_width: 1280
    input_height: 720
    fx: 561.400939941
    fy: 561.136352539
    cx: 643.032653809
    cy: 352.621124268

    # Vehicle coordinates: origin=front-axle ground center,
    # +X=forward, +Y=left, +Z=up.
    camera_x_m: 0.0
    camera_y_m: 0.0
    camera_z_m: 0.20
    # These two values are fallbacks until a valid OAK IMU attitude arrives.
    camera_roll_deg: 0.0
    camera_downward_pitch_deg: 14.0
    # Yaw is camera-to-vehicle mounting yaw and is never replaced by IMU.
    camera_yaw_deg: 0.0

    # Ten 100 Hz samples take about 0.1 s. Once stable roll/pitch are found,
    # the BEV LUT is replaced once and then kept fixed during driving.
    imu_attitude_enabled: true
    imu_topic: "/camera/imu"
    imu_attitude_sample_count: 10
    imu_attitude_max_stddev_deg: 0.5
    imu_accel_min_mps2: 7.5
    imu_accel_max_mps2: 12.0

    # Image top is forward; image left is vehicle left.
    x_min_m: 0.18
    x_max_m: 3.0
    y_min_m: -1.0
    y_max_m: 1.0
    meter_per_pixel: 0.01

    # output_width = round((y_max_m - y_min_m) / meter_per_pixel)
    # output_height = round((x_max_m - x_min_m) / meter_per_pixel)
    output_width: 200
    output_height: 282

    status_log_interval_sec: 5.0
    startup_timeout_sec: 5.0
