# Ground-plane obstacle detection. B: replace plane file, C: camera ON/OFF.
depth_lidar:
  ros__parameters:
    # Camera pipeline parameters. Changes restart only this package's camera pipeline.
    camera.fps: 60.0
    camera.resolution: "400p"       # 400p, 480p, 720p, 800p

    depth.mode: "high_density"      # default, high_density, high_accuracy
    depth.confidence_threshold: 200
    depth.left_right_check: true
    depth.subpixel: false
    depth.extended_disparity: false
    depth.median_filter: "3x3"      # off, 3x3, 5x5, 7x7

    # Centered ROI. Its bottom edge is this ratio above the image bottom.
    roi.width_ratio: 1.0
    roi.height_ratio: 0.30
    roi.bottom_offset_ratio: 0.25

    range.min_m: 0.10
    range.max_m: 3.0
    # corrected range = measured range + offset. Negative values make obstacles closer.
    range.offset_m: 0.0
    points.pixel_stride: 1

    # Persistent ground plane, loaded on startup; never auto-measured.
    # B or /depth_lidar/measure_floor discards the previous model AND file first.
    # Keep the blue measurement ROI clear of objects while stationary.
    floor.file: "~/.ros/depth_lidar/floor_reference.bin"
    floor.measure_frames: 60
    floor.min_valid_ratio: 0.50
    # Separate lower ROI for plane fitting; green roi.* remains the detection ROI.
    floor.measure_roi_width_ratio: 0.80
    floor.measure_roi_height_ratio: 0.35
    floor.measure_roi_bottom_offset_ratio: 0.05
    floor.fit_pixel_stride: 4
    floor.fit_max_depth_m: 4.0
    floor.ransac_iterations: 200
    floor.inlier_distance_m: 0.02
    floor.min_inlier_points: 100
    floor.min_inlier_ratio: 0.60
    # Limits apply to NEW measurements. Narrow height limits to the actual mount.
    # Tilt is the angle between floor normal and camera up, including pitch/roll.
    floor.max_tilt_deg: 60.0
    floor.min_camera_height_m: 0.05
    floor.max_camera_height_m: 1.0
    # Candidates must be above the floor: max(min_height, noise_scale * fit RMSE).
    floor.min_height_m: 0.05
    floor.max_height_m: 1.0
    floor.noise_scale: 3.0

    # Cluster foreground pixels before computing mean X/Y and covering radius.
    # 8-connected image neighbors must also be within this 3D distance.
    cluster.min_points: 20
    cluster.neighbor_distance_m: 0.08
    cluster.radius_margin_m: 0.04
    cluster.min_radius_m: 0.05

    # Pull CAM_A NV12 to a dedicated latest-frame host receiver without
    # converting, publishing, or previewing it. This measures concurrent USB load.
    nv12.enabled: true
    nv12.fps: 60.0
    nv12.width: 1280
    nv12.height: 800

    # White radar on the ground plane: origin=camera foot, top=forward, left=left.
    # Range rings extend to range.max_m; size_px sets the image width.
    preview.enabled: true
    preview.gui: true
    preview.fps: 30.0
    preview.size_px: 700

    # Rectified images: green=detection ROI, blue=floor measurement ROI.
    # enabled toggles USB streams (pipeline restart); gui toggles only the window.
    # Press C in either preview window to toggle enabled.
    stereo_preview.enabled: true
    stereo_preview.gui: true
    stereo_preview.fps: 30.0

    # Legacy BEV settings below are accepted but not used by the radar preview.
    preview.scale: 3
    bev.x_min_m: 0.0
    bev.x_max_m: 3.0
    bev.y_min_m: -0.6
    bev.y_max_m: 0.6
    bev.meter_per_pixel: 0.01

    # Legacy sensor pose, unused by the ground-aligned radar preview.
    sensor.x_m: -0.16
    sensor.y_m: 0.0
    sensor.yaw_deg: 0.0

    metrics.print_interval_sec: 1.0
    frame_id: "depth_lidar_ground"
