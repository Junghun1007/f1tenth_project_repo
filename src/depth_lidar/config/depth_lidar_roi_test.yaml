# ROI tuning: radar + rectified stereo windows. Press C to toggle camera.
depth_lidar:
  ros__parameters:
    # Camera pipeline parameters. Changes restart only this package's camera pipeline.
    camera.fps: 60.0
    camera.resolution: "400p"       # 400p, 480p, 720p, 800p

    depth.mode: "high_density"      # default, high_density, high_accuracy
    depth.confidence_threshold: 200
    depth.left_right_check: true
    depth.subpixel: false
    depth.extended_disparity: false
    depth.median_filter: "3x3"      # off, 3x3, 5x5, 7x7

    # Centered ROI. Its bottom edge is this ratio above the image bottom.
    roi.width_ratio: 1.0
    roi.height_ratio: 0.10
    roi.bottom_offset_ratio: 0.35

    range.min_m: 0.10
    range.max_m: 3.0
    # corrected range = measured range + offset. Negative values make obstacles closer.
    range.offset_m: 0.0
    scan.bins: 360
    scan.pixel_stride: 1
    scan.min_points_per_bin: 1
    # Per-angle valid range selection; neither mode removes the ground.
    scan.range_selection: "farthest"    # nearest, farthest

    # Consecutive occupied angular bins are grouped in one O(N) pass. Radius is
    # estimated from angular support * range, then clamped and inflated.
    cluster.min_bins: 3
    cluster.max_missing_bins: 1
    cluster.base_neighbor_distance_m: 0.04
    cluster.angular_neighbor_scale: 1.5
    cluster.radius_margin_m: 0.04
    cluster.min_radius_m: 0.05
    cluster.max_radius_m: 0.40

    # Pull CAM_A NV12 to a dedicated latest-frame host receiver without
    # converting, publishing, or previewing it. This measures concurrent USB load.
    nv12.enabled: true
    nv12.fps: 60.0
    nv12.width: 1280
    nv12.height: 800

    # White radar preview in the camera frame: top=forward, left=camera left.
    # Range rings extend to range.max_m; size_px sets the image width.
    preview.enabled: true
    preview.gui: true
    preview.fps: 30.0
    preview.size_px: 700

    # Optional rectified left/right camera images with scan ROI overlay.
    # enabled toggles USB streams (pipeline restart); gui toggles only the window.
    # Press C in either preview window to toggle enabled.
    stereo_preview.enabled: true
    stereo_preview.gui: true
    stereo_preview.fps: 30.0

    # Legacy BEV settings below are accepted but not used by the radar preview.
    preview.scale: 3
    bev.x_min_m: 0.0
    bev.x_max_m: 3.0
    bev.y_min_m: -0.6
    bev.y_max_m: 0.6
    bev.meter_per_pixel: 0.01

    # Legacy sensor pose, unused by the camera-frame radar preview.
    sensor.x_m: -0.16
    sensor.y_m: 0.0
    sensor.yaw_deg: 0.0

    metrics.print_interval_sec: 1.0
    frame_id: "depth_lidar"
