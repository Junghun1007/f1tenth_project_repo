depth_lidar:
  ros__parameters:
    # Camera pipeline parameters. Changes restart only this package's camera pipeline.
    camera.fps: 60.0
    camera.resolution: "400p"       # 400p, 480p, 720p, 800p

    depth.mode: "high_density"      # default, high_density, high_accuracy
    depth.confidence_threshold: 200
    depth.left_right_check: true
    depth.subpixel: false
    depth.extended_disparity: false
    depth.median_filter: "3x3"      # off, 3x3, 5x5, 7x7

    # Centered ROI. Its bottom edge is this ratio above the image bottom.
    roi.width_ratio: 1.0
    roi.height_ratio: 0.30
    roi.bottom_offset_ratio: 0.25

    range.min_m: 0.20
    range.max_m: 8.0
    # corrected range = measured range + offset. Negative values make obstacles closer.
    range.offset_m: 0.0
    points.pixel_stride: 1

    # Persistent per-pixel floor reference, loaded on startup; never auto-measured.
    # Press B or call /depth_lidar/measure_floor only when the scene contains floor.
    # A new measurement discards the previous in-memory reference AND file first.
    floor.file: "~/.ros/depth_lidar/floor_reference.bin"
    floor.measure_frames: 60
    floor.min_valid_ratio: 0.50
    floor.min_delta_m: 0.05
    floor.noise_scale: 3.0
    # Pixel hysteresis: release at 60% of max(min_delta, noise_scale * sigma).
    floor.release_ratio: 0.60

    # Confirm a cluster in 2 of the last 3 processed depth frames, hold up to 80ms.
    # Matching uses camera-frame XY centers; no odometry/motion compensation.
    stabilization.enabled: true
    stabilization.confirm_hits: 2
    stabilization.window_frames: 3
    stabilization.hold_sec: 0.08
    stabilization.match_distance_m: 0.15
    stabilization.max_frame_gap_sec: 0.20

    # Cluster foreground pixels before computing mean X/Y and covering radius.
    # 8-connected image neighbors must also be within this 3D distance.
    cluster.min_points: 20
    cluster.neighbor_distance_m: 0.08
    cluster.radius_margin_m: 0.04
    cluster.min_radius_m: 0.05

    # Pull CAM_A NV12 to a dedicated latest-frame host receiver without
    # converting, publishing, or previewing it. This measures concurrent USB load.
    nv12.enabled: true
    nv12.fps: 60.0
    nv12.width: 1280
    nv12.height: 800

    # White radar preview in the camera frame: top=forward, left=camera left.
    # Range rings extend to range.max_m; size_px sets the image width.
    preview.enabled: true
    preview.gui: false
    preview.fps: 10.0
    preview.size_px: 700

    # Optional rectified left/right camera images with detection ROI overlay.
    # enabled toggles USB streams (pipeline restart); gui toggles only the window.
    # Press C in either preview window to toggle enabled.
    stereo_preview.enabled: false
    stereo_preview.gui: false
    stereo_preview.fps: 15.0

    # Legacy BEV settings below are accepted but not used by the radar preview.
    preview.scale: 3
    bev.x_min_m: 0.0
    bev.x_max_m: 3.0
    bev.y_min_m: -0.6
    bev.y_max_m: 0.6
    bev.meter_per_pixel: 0.01

    # Legacy sensor pose, unused by the camera-frame radar preview.
    sensor.x_m: -0.16
    sensor.y_m: 0.0
    sensor.yaw_deg: 0.0

    metrics.print_interval_sec: 1.0
    frame_id: "depth_lidar"
