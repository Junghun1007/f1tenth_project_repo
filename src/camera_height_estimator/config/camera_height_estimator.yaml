camera_height_estimator:
  ros__parameters:
    output_topic: "/camera/height"

    # This package opens OAK itself. It does not use camera_driver topics.
    stereo_fps: 30.0
    stereo_width: 640
    stereo_height: 400
    depth_queue_size: 2
    imu_rate_hz: 100.0
    imu_queue_size: 20

    # Center region of the RGB-aligned depth image.
    roi_width: 10
    roi_height: 10
    minimum_valid_pixels: 25

    minimum_depth_m: 0.30
    maximum_depth_m: 3.00
    minimum_height_m: 0.10
    maximum_height_m: 1.00

    # Spatial consistency inside one 10x10 depth frame.
    maximum_height_mad_m: 0.015
    # Reject an almost-horizontal optical axis because height becomes unstable.
    minimum_downward_ray_component: 0.05

    # A short, stationary IMU window fixes the gravity direction.
    imu_sample_count: 10
    imu_max_direction_rms_deg: 0.50
    imu_accel_min_mps2: 7.50
    imu_accel_max_mps2: 12.00

    # Temporal consistency across independent depth frames.
    stable_depth_frame_count: 5
    maximum_height_stddev_m: 0.010

    measurement_timeout_sec: 10.0
