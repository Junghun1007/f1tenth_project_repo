actuator_commander_node:
  ros__parameters:
    accelerator_topic: "/manual/accelerator"       # RT, std_msgs/msg/Float32, 0.0 ~ 1.0
    brake_topic: "/manual/brake"                   # LT, std_msgs/msg/Float32, 0.0 ~ 1.0
    steering_topic: "/manual/steering"             # 왼쪽 스틱 X, -1.0 ~ 1.0
    gear_toggle_topic: "/manual/gear_toggle"       # Y 버튼, std_msgs/msg/Bool
    current_erpm_topic: "/manual/current_erpm"     # 현재 명령 ERPM
    gear_state_topic: "/manual/gear"               # FORWARD 또는 REVERSE
    erpm_topic: "/vesc/erpm"
    servo_position_topic: "/vesc/servo_position"

    forward_max_erpm: 5000
    reverse_max_erpm: 2000
    start_erpm: 1000             # RT 가속을 시작할 때 즉시 적용할 ERPM 크기
    acceleration_erpm_per_sec: 800.0
    coast_deceleration_erpm_per_sec: 1500.0  # 페달을 놓았을 때 자연 감속량
    brake_erpm_per_sec: 5000.0               # LT를 끝까지 누를 때 감속량
    control_rate_hz: 50.0
    status_log_rate_hz: 2.0
    input_timeout_sec: 0.30

    servo_left: 0.98
    servo_center: 0.50
    servo_right: 0.02
    pedal_deadzone: 0.01
    steering_deadzone: 0.04