# 이 파일을 직접 수정하고 obstacle_params_file:=/absolute/path/obstacles.yaml 로 실행.
# 저장 후 통합 launch 재시작. avoidance.enabled만 실시간 ON/OFF 가능, 나머지는 시작 시 적용.
# auto_drive.launch.py에서 사용. manual_test:=true이면 수동주행으로 통합 확인.
# roi_lidar는 실행하지 않음. 기존 차선 BEV 120cm x 300cm / 모델 120x300 유지.
camera_driver:
  ros__parameters:
    # CAM_A RGB는 camera_config.yaml 설정 유지. 같은 OAK의 CAM_B/C로 depth 생성.
    obstacles.depth.enabled: true
    obstacles.camera.resolution: "400p" # 400p / 480p / 720p / 800p
    obstacles.camera.fps: 60.0          # 요청 FPS. RGB/Depth 동시 실행 실측 FPS는 로그 확인.
    obstacles.depth.mode: "high_density" # default / high_density / high_accuracy
    obstacles.depth.ir_dot_projector_intensity: 0.7 # 지원하지 않는 장치는 0.0
    obstacles.depth.ir_flood_light_intensity: 0.0
    obstacles.depth.confidence_threshold: 200
    obstacles.depth.left_right_check: true
    obstacles.depth.left_right_threshold: 10
    obstacles.depth.subpixel: true
    obstacles.depth.subpixel_fractional_bits: 3
    obstacles.depth.median_filter: "off"

bev_processor:
  ros__parameters:
    obstacles.share_reference: true # 시작 측정/BEV 기하만 auto_control에 공유. 검출은 수행하지 않음.

auto_obstacles:
  ros__parameters:
    # Depth 전체 영상에서의 정규화 ROI. RGB/BEV 픽셀 기준이 아님.
    obstacles.roi.x: 0.0
    obstacles.roi.y: 0.0
    obstacles.roi.width: 1.0
    obstacles.roi.height: 1.0
    obstacles.points.pixel_stride: 2 # 1이면 작은 장애물 표본 증가, CPU 비용 증가
    obstacles.points.min_depth_m: 0.1
    obstacles.points.max_depth_m: 20.0
    # BEV가 시작할 때 측정한 평면 및 RGB에 실제 적용한 보정으로 지면 높이 계산.
    obstacles.ground.enabled: true
    obstacles.ground.distance_m: 0.05
    obstacles.ground.distance_per_meter: 0.01
    obstacles.ground.max_distance_m: 0.12
    obstacles.height.max_m: 1.0
    obstacles.range.min_m: 0.1
    obstacles.range.max_m: 12.0 # 검출 범위. 화면은 기존 전방 3m/좌우 0.6m로 제한.
    obstacles.scan.angle_min_deg: -70.0
    obstacles.scan.angle_max_deg: 70.0
    obstacles.scan.bins: 281
    obstacles.scan.min_samples: 2
    obstacles.scan.support_distance_m: 0.15
    obstacles.cluster.tolerance_m: 0.15
    obstacles.cluster.min_bins: 2 # 1이면 작은 군집도 표시, 고립 노이즈 증가
    obstacles.cluster.max_gap_bins: 1
    obstacles.cluster.min_height_m: 0.10
    obstacles.max_age_sec: 0.25
    obstacles.max_sync_sec: 0.04 # Depth와 자세 보정에 쓰는 RGB 촬영 시각 차이 상한

    # 회피 경로 테스트. 기본 화면 전용, avoidance_control_enabled:=true이면 실제 제어 연결.
    # enabled만 ros2 param set으로 즉시 변경 가능. 나머지는 재실행 필요.
    obstacles.avoidance.enabled: false
    obstacles.avoidance.max_fps: 10.0 # 차선과 독립 스레드. 최대 계획 빈도
    obstacles.avoidance.max_age_sec: 0.25
    obstacles.avoidance.max_sync_sec: 0.06
    obstacles.avoidance.centerline_fallback_enabled: true # 누락 경계는 기존 중앙선+차선 폭으로 추정
    obstacles.avoidance.vehicle_half_width_m: 0.15
    obstacles.avoidance.vehicle_half_length_m: 0.25 # 앞차축 기준 가장 먼 차체 끝까지 거리로 설정
    obstacles.avoidance.obstacle_size_m: 0.13 # 관측 표면 뒤 물체 깊이 / 최소 가로 폭 (13x13cm)
    obstacles.avoidance.safety_margin_m: 0.04
    obstacles.avoidance.unknown_extent_m: 0.04 # Depth에서 보이지 않는 물체 뒷면/측면 여유
    obstacles.avoidance.sample_step_m: 0.025
    obstacles.avoidance.max_offset_m: 0.40
    obstacles.avoidance.offset_step_m: 0.05
    obstacles.avoidance.transition_m: 0.70 # 이동/복귀 각각의 최소 전방 길이. 공간이 더 있으면 완만하게 사용
    obstacles.avoidance.max_curvature_per_m: 2.0 # 최소 회전반경 0.5m. 차량 한계 이하로 설정
    obstacles.avoidance.max_speed_mps: 0.5 # 실제 적용 ON이면 제어 속도 상한에도 반영
    obstacles.avoidance.lateral_acceleration_mps2: 0.4
    obstacles.avoidance.deceleration_mps2: 0.5 # 유효 경로 끝까지 정지 가능한 목표 속도 계산용 감속도
    obstacles.avoidance.stop_response_sec: 0.35 # 영상 나이+제어/제동 응답 여유, 허용 0.20..2.0초
    obstacles.avoidance.clear_confirm_sec: 1.0 # 새 Depth에서 연속으로 중앙 경로가 비어야 복귀 표시

line_detactor:
  ros__parameters:
    obstacles.overlay_enabled: true
    obstacles.max_sync_sec: 0.06 # 차선 결과와 장애물 촬영 시각 차이 상한
    obstacles.max_age_sec: 0.25  # 만료 장애물은 GUI에서 삭제 (입력 중단 시에도 갱신)
