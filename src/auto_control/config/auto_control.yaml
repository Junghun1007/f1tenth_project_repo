auto_control:
  ros__parameters:
    # true이면 VESC 연결, 최신 ERPM, 유효 중앙선이 모두 준비되는 즉시 출발한다.
    # 주행 중 `ros2 topic pub --once /auto/enabled std_msgs/msg/Bool "data: false"`
    # 로 언제든 duty 0과 중앙 조향으로 전환할 수 있다.
    enabled: true
    # drive: duty/brake/servo output, steering_only: servo output only,
    # monitor_only: actuator output 없이 lateral/heading 오차만 계산 및 발행
    control_mode: "drive"
    enable_topic: "/auto/enabled"
    lane_result_topic: "/line_detactor/result"
    lane_result_frame_id: "front_axle_bev"
    path_maximum_gap_m: 0.15
    measured_erpm_topic: "/vesc/measured_erpm"
    connection_status_topic: "/vesc/connected"
    duty_topic: "/vesc/duty"
    brake_current_topic: "/vesc/brake_current"
    servo_position_topic: "/vesc/servo_position"

    command_duty_topic: "/auto/current_duty"
    command_brake_current_topic: "/auto/current_brake_current"
    target_speed_topic: "/auto/target_speed"
    current_speed_topic: "/auto/current_speed"
    curvature_topic: "/auto/path_curvature"
    steering_angle_topic: "/auto/steering_angle_rad"
    cross_track_error_topic: "/auto/cross_track_error_m"
    heading_error_topic: "/auto/heading_error_rad"
    raw_steering_angle_topic: "/auto/raw_steering_angle_rad"
    command_servo_position_topic: "/auto/current_servo_position"

    # 새 LaneResult마다 즉시 계산/발행한다. 아래 주기는 정지 감시용이며
    # steering_current_weight의 시간 환산 기준이다. 제어 결과 FPS 상한이 아니다.
    control_rate_hz: 80.0
    status_log_rate_hz: 2.0
    # 중앙선 수신, 원본 영상 timestamp, ERPM 중 하나라도 오래되면 즉시 duty 0.
    path_timeout_sec: 0.15
    path_capture_maximum_age_sec: 0.20
    erpm_timeout_sec: 0.15

    # LaneResult 확장 영상의 padding_left를 제거하고 BEV 픽셀 중심을 미터로 변환한다.
    # auto_drive는 아래 배율/원점을 bev_params_file에서 자동으로 맞춘다.
    bev_x_max_m: 3.0
    bev_y_max_m: 0.60
    bev_meter_per_pixel: 0.01

    # ML 중앙선의 근거리->원거리 순서를 유지하며 재평활화/전역 피팅하지 않는다.
    # 첫 연속 X ROI 구간만 사용한다. span은 X 폭이 아닌 경로를 따른 길이다.
    # 인접 점 간격이 path_maximum_gap_m을 넘으면 그 앞에서 경로를 자른다.
    path_minimum_x_m: 0.05
    path_maximum_x_m: 2.20
    path_minimum_points: 8
    path_minimum_span_m: 0.12
    path_geometry_window_m: 0.12

    # Stanley: +조향각은 차량 좌표 +Y인 좌회전이다.
    stanley_gain: 1.55
    stanley_softening_speed_mps: 0.35
    # 앞차축에서 가장 가까운 경로 투영점부터 경로를 따라 12cm 앞의 접선을 쓴다.
    stanley_heading_lookahead_m: 0.12
    # 선수각 20도 이상의 급코너에서만 방향 guard를 적용하고,
    # 반대 방향 횡오차 보정을 선수각의 90%까지 허용한다.
    stanley_corner_heading_threshold_deg: 20.0
    stanley_corner_opposing_correction_ratio: 0.90
    maximum_steering_angle_deg: 30.0
    # control_rate_hz 기준 현재 조향 58%, 이전 명령 42%의 응답을
    # 실제 결과 수신 간격에 맞춰 환산하고 조향 변화율 제한을 함께 적용한다.
    steering_current_weight: 0.58
    steering_rate_limit_deg_per_sec: 240.0
    servo_left: 1.0
    servo_center: 0.46
    servo_right: 0.0
    # 수동주행에서 확인한 실차 서보 링크 방향에 맞춰 최종 출력만 반전한다.
    # /auto/steering_angle_rad의 +는 계속 차량 좌회전 의미를 유지한다.
    steering_servo_inverted: true

    # 곡률의 90 percentile로 순간 한 점의 spike를 무시하면서 코너를 감속한다.
    minimum_speed_mps: 0.80
    maximum_speed_mps: 5.0
    maximum_lateral_acceleration_mps2: 1.2
    curvature_lookahead_minimum_x_m: 0.50
    curvature_lookahead_maximum_x_m: 1.60
    curvature_percentile: 90.0

    # 유효 경로가 생기면 manual_control과 같이 start duty를 즉시 적용한 뒤
    # PID+feed-forward 목표까지 rate limit으로 이동한다. 경로 유실은 즉시 0이다.
    minimum_duty: 0.12
    maximum_duty: 0.20
    duty_rise_rate_per_sec: 0.04
    duty_fall_rate_per_sec: 0.08
    speed_pid_kp: 0.012
    speed_pid_ki: 0.004
    speed_pid_kd: 0.0
    speed_pid_integral_limit: 1.0
    speed_filter_time_constant_sec: 0.05

    # 실제 속도가 목표 속도보다 0.10m/s 이상 높으면 duty를 즉시 버리고
    # COMM_SET_CURRENT_BRAKE로 전환한다. 오차가 0.03m/s 이하가 될 때까지
    # 제동을 유지해 경계에서 duty/브레이크가 반복 전환되는 것을 막는다.
    # 기본 최대 2.5A는 수동 LT의 8A와 VESC 설정 한도보다 보수적인 값이다.
    electrical_brake_enabled: false
    brake_entry_speed_error_mps: 0.10
    brake_exit_speed_error_mps: 0.03
    brake_minimum_vehicle_speed_mps: 0.20
    brake_minimum_current_amps: 1.0
    brake_maximum_current_amps: 2.5
    brake_current_gain_amps_per_mps: 6.0
    brake_current_rise_amps_per_sec: 6.0
    brake_current_fall_amps_per_sec: 16.0

    # Traxxas Slash 4X4 Ultimate 순정 구동계와 기존 camera_driver 값.
    wheel_diameter_m: 0.1095
    motor_pole_pairs: 2
    motor_pinion_teeth: 13
    spur_gear_teeth: 54
    differential_pinion_teeth: 13
    differential_ring_teeth: 37
    erpm_direction_sign: 1.0
    speed_scale_correction: 1.0

    # auto_drive performance mode overrides control_mode to monitor_only,
    # starts after the first valid centerline reaches servo-position calculation,
    # records a new JSON file, then shuts the complete launch down.
    performance_measurement_enabled: false
    performance_measurement_duration_sec: 30.0
    performance_measurement_startup_timeout_sec: 300.0
    performance_measurement_power_sample_interval_sec: 0.1
    performance_measurement_log_directory: "performance_logs"
    # auto_drive fills these from the selected line_detactor YAML.
    performance_measurement_engine_precision: "unknown"
    performance_measurement_model_path: ""
