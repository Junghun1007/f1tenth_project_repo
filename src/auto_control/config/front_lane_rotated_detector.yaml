front_lane_rotated_detector:
  ros__parameters:
    # One resizable preview contains the detected boundaries, centreline and
    # the actual rotated sliding-window polygons.
    preview_enabled: true
    preview_window_name: "Front lane detection - rotated windows"
    preview_window_width_px: 960
    preview_window_height_px: 540
    preview_fps: 30.0
    processing_fps: 30.0
    roi_top_ratio: 0.56
    roi_bottom_ratio: 1.00
    seed_row_ratio: 0.75
    close_target_y_ratio: 0.70
    far_target_y_ratio: 0.60
    vehicle_reference_y_ratio: 0.955
    # Start at the seed closest to the vehicle and track only toward the far
    # field. Width is intentionally a little longer than height.
    rotated_window_initial_width_px: 120
    rotated_window_initial_height_px: 90
    rotated_window_min_width_px: 54
    rotated_window_min_height_px: 40
    # Each successive window is 94% of the preceding one until the minimum.
    rotated_window_shrink_ratio: 0.94
    # Advance by 60% of the current window height so adjacent windows overlap.
    rotated_window_step_ratio: 0.60
    rotated_max_turn_deg_per_window: 18.0
    rotated_max_turn_change_deg_per_window: 10.0
    rotated_heading_update_gain: 0.45

    show_diagnostic_windows: true
    show_center_guidance: true
