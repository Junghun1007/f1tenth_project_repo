# Integrated IR lane settings. The independent IR test keeps its own profile.
line_detactor:
  ros__parameters:
    input_topic: /ir_bev_line_detection/image_bgr
    direct_bev_input_enabled: false
    engine_precision: fp32
    # One preview window is owned by the RGB detector, including selected IR.
    preview_enabled: false
    bev_theme_enable: false
    preview_window_name: IR BEV lane following
    preview_result_only_enabled: false
    result_topic: /ir_bev_line_detection/result
    result_image_topic: /ir_bev_line_detection/result_image
    stop_line_mask_threshold: 1.0
    stop_line_distance_enabled: false
    model_input_width: 120
    model_input_height: 300
    connection_enabled: true
    centerline_enabled: true
    result_publish_enabled: true
    centerline_bev_width_m: 1.2
    centerline_bev_height_m: 3.0
