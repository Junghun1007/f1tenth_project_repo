camera_driver:
  ros__parameters:
    enabled: true

    # Requested OAK sensor/output rate. The physical sensor and selected mode
    # must support 120 FPS; the node reports the measured rate at runtime.
    sensor_fps: 120.0
    width: 640
    height: 480

    camera_socket: "CAM_A"
    resize_mode: "STRETCH"

    # Runs inside the OAK/DepthAI pipeline, not with host-side cv::remap().
    undistort_enabled: true

    # A small non-blocking queue prevents slow consumers from stalling capture.
    queue_size: 2
    queue_blocking: false

    frame_id: "camera_optical_frame"
    image_topic: "/camera/image_rect"

    # Full-rate publication is available for same-process components.
    # Disable or lower publish_fps when only direct processing/preview is used.
    publish_enabled: true
    publish_fps: 120.0

    # Preview is independent from capture. Its real rate is also limited by
    # the display refresh rate and OpenCV GUI performance.
    preview_enabled: true
    preview_fps: 120.0
    preview_window_name: "OAK rectified image"
    preview_max_width: 1280
    preview_max_height: 720

    startup_timeout_sec: 5.0
    status_log_interval_sec: 5.0
