roi_vfh_test:
  ros__parameters:
    gui: true
    drive_enabled: true # Start enables actual VESC output; launch drive_enabled:=false for preview only.
    nominal_speed_mps: 0.7
    horizon_m: 1.4
    sample_step_m: 0.04
    safety_margin_m: 0.02
    lane_departure_m: 0.40 # Body outer edge; normal obstacle avoidance only.
    reference_distance_m: 1.0
    lane_lookahead_m: 0.30 # Track the full lane/corridor curve before invoking VFH+.
    histogram_low: 1.0
    histogram_high: 2.0
    max_age_sec: 0.30
    max_sync_sec: 0.10
    deceleration_mps2: 0.5 # Upper-bounded by auto_control planning deceleration; not a measured guarantee.
    response_delay_sec: 0.20
