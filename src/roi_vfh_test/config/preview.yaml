roi_vfh_test:
  ros__parameters:
    gui: true
    drive_enabled: true # Start enables actual VESC output; launch drive_enabled:=false for preview only.
    nominal_speed_mps: 0.8
    horizon_m: 1.4
    sample_step_m: 0.03
    safety_margin_m: 0.03
    lane_departure_m: 0.40 # Body outer edge; normal obstacle avoidance only.
    reference_distance_m: 1.0
    lane_lookahead_m: 0.05 # Stanley tangent lookahead; attached controller profile overrides this value.
    histogram_low: 1.0
    histogram_high: 2.0
    max_age_sec: 0.30 # User-selected lane/terrain capture lifetime; also used by the actuator guard.
    input_resume_stable_sec: 0.50 # Input pause resumes after continuous valid input; Stop cancels.
    max_sync_sec: 0.10
    deceleration_mps2: 0.4 # Upper-bounded by auto_control planning deceleration; not a measured guarantee.
    response_delay_sec: 0.10
    # Small hazard confirmation; numeric switches/counts are GUI-editable doubles.
    hazard_filter_enabled: 1.0
    hazard_confirm_frames: 4.0
    hazard_small_max_cells: 8.0
    hazard_match_radius_cells: 1.0
    hazard_max_gap_sec: 0.15
    # Continuous avoidance/return tuning (editable before Start, numeric doubles).
    avoidance_curve_enabled: 1.0
    avoidance_curve_samples: 9.0
    avoidance_length_slack_m: 0.10
    avoidance_lane_weight: 1.0
    avoidance_steering_weight: 1.0
