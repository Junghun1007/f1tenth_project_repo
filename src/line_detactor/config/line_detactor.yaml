line_detactor:
  ros__parameters:
    input_topic: "/camera/image_bev"
    # model_path defaults to fast_scnn_stop_line_120x300_batch_1.onnx (3 channels).
    # Run tools/export_stop_line_onnx.py after training before copying/building this package.
    engine_cache_path: ""
    # fp32/fp16 use the ordinary FP32 ONNX; int8 requires the explicit Q/DQ ONNX.
    engine_precision: "fp32"
    tensorrt_workspace_size_mb: 1024
    model_input_width: 120
    model_input_height: 300
    mask_threshold: 0.5                  # Independent sigmoid threshold for left/right/stop_line.
    overlay_alpha: 0.75
    warmup_iterations: 10

    # Border-only mode: remove tiny components; preserve all other model pixels.
    # Only join two cut ends on the SAME left/right image edge, OUTSIDE the BEV.
    # false shows raw masks, with no cleanup/interpolation/result publication.
    connection_enabled: true
    result_padding_px: 30                 # Each side, output canvas only: 120 -> 180.
    connection_min_component_area_px: 8   # Sole noise-removal rule; 1 disables removal.
    # 1..4; 2 thins each component at about half width/height, then restores coordinates.
    # Original labels stay intact; coarse skeletons may change endpoints/corner shape.
    connection_skeleton_downsample_factor: 1
    connection_border_endpoint_distance_px: 6.0 # Skeleton tip -> actual edge contact limit.
    connection_min_fragment_length_px: 8.0 # Minimum support for interpolation ONLY.
    connection_max_fragments: 24          # Cap border candidates only; never deletes masks.
    connection_tangent_window_px: 8.0
    connection_max_gap_px: 80.0
    connection_corridor_half_width_px: 4.0
    connection_direction_tolerance_deg: 20.0
    connection_max_turn_deg: 180.0
    connection_max_curvature_per_px: 0.12
    connection_max_arc_ratio: 1.8
    result_line_width_px: 2               # Outside bridge stroke ONLY; raw width preserved.

    result_publish_enabled: true
    result_topic: "/line_detactor/result"
    result_image_topic: "/line_detactor/result_image"
    # Detector input -> final servo/duty decision latency fed back by auto_control.
    control_latency_topic: "/auto/detector_input_to_control_decision_ms"

    preview_enabled: true
    # Black background with lanes/stop line/yellow path; skip source-image blending.
    preview_result_only_enabled: true
    # GUI refresh only. Inference/result publication run whenever a new BEV arrives.
    preview_fps: 30.0
    preview_scale: 2.0
    preview_window_name: "BEV lane TensorRT preview"
    status_log_interval_sec: 1.0

    # Centerline: labels 1/2 only, stop lines and border bridges excluded.
    # BEV extents are physical SOURCE image dimensions; padding is not included.
    # Requires connection_enabled: true. Parameters are read at startup.
    centerline_enabled: true
    centerline_lane_width_m: 0.65
    centerline_bev_width_m: 1.2
    centerline_bev_height_m: 3.0
    centerline_sample_spacing_m: 0.015
    centerline_output_spacing_m: 0.01    # 0.005..0.10m; final path spacing before smoothing.
    # 0.001..0.05m, independent of candidate/output spacing. Half this step is added
    # to the clearance guard; larger steps reduce checks but can reject tighter paths.
    centerline_clearance_check_spacing_m: 0.005
    centerline_min_fragment_length_m: 0.08
    centerline_tangent_window_m: 0.06
    centerline_width_tolerance_m: 0.12
    centerline_pair_along_tolerance_m: 0.055
    centerline_pair_heading_tolerance_deg: 40.0
    centerline_max_gap_m: 0.12
    centerline_max_start_distance_m: 0.65
    centerline_min_clearance_m: 0.16
    centerline_outside_margin_m: 0.12
    centerline_max_samples: 2000
    centerline_line_width_px: 2
    # Prefer the observed OUTER boundary shape in corners; fade with local support/turn.
    centerline_corner_outer_enabled: true
    centerline_corner_outer_weight: 0.85
    # Additional outward path shift for observed corners and their straight entry.
    # 0 disables the shift; shape weighting above remains active. Clearance still applies.
    centerline_corner_outward_offset_m: 0.05
    # Extend local corner evidence this far back along the observed boundary,
    # with a smooth ramp. 0 keeps only the local corner shift; valid range 0..5m.
    centerline_corner_entry_distance_m: 0.40
    centerline_corner_outer_window_m: 0.60
    centerline_corner_outer_tangent_window_m: 0.15
    centerline_corner_outer_min_length_m: 0.30
    centerline_corner_outer_min_turn_deg: 8.0
    centerline_corner_outer_full_turn_deg: 25.0

    centerline_smoothing_enabled: true
    centerline_smoothing_sigma_m: 0.04
    centerline_smoothing_window_m: 0.65
    centerline_smoothing_max_shift_m: 0.03
    centerline_smoothing_strength: 1.0
    centerline_straight_turn_deg: 12.0
    centerline_corner_turn_deg: 35.0
    centerline_turn_window_m: 0.30
