vesc_interface_node:
  ros__parameters:
    port: "/dev/ttyACM0"      # VESC가 연결된 시리얼 장치 경로
    baudrate: 115200          # VESC와 통신할 시리얼 속도
    serial_timeout: 0.1       # 시리얼 읽기 대기 시간(초)
    write_timeout: 2.0        # 시리얼 쓰기 대기 시간(초)
    startup_delay: 0.2        # 포트 연결 후 안정화를 위해 기다리는 시간(초)
    connect_on_startup: true  # 노드 시작 시 VESC 포트를 먼저 열어본다.

    erpm_topic: "/vesc/erpm"                       # std_msgs/msg/Int32
    servo_position_topic: "/vesc/servo_position"   # std_msgs/msg/Float32

    min_erpm: -100000      # ERPM 명령 하한. 실제 제한값은 추후 차량에 맞게 조정한다.
    max_erpm: 100000       # ERPM 명령 상한. 실제 제한값은 추후 차량에 맞게 조정한다.
    servo_min: 0.0         # VESC servo position 하한
    servo_max: 1.0         # VESC servo position 상한
    command_timeout: 0.3   # 이 시간 동안 새 ERPM 명령이 없으면 ERPM 0을 보낸다.

    packet:
      start_byte: 2           # VESC short packet 시작 바이트
      end_byte: 3             # VESC packet 종료 바이트
      comm_set_duty: 5        # 현재 비활성화. 모터 속도는 ERPM 명령을 사용한다.
      comm_set_erpm: 8        # VESC set_rpm expects ERPM, not wheel RPM. ERPM is electrical RPM.
      comm_set_servo_pos: 12  # 서보 위치 명령 ID(COMM_SET_SERVO_POS)
      duty_scale: 100000      # 현재 비활성화. 나중에 duty를 다시 켤 때 사용한다.
      servo_scale: 1000       # servo position float 값을 VESC 정수 payload로 바꾸는 배율
