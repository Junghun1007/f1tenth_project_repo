actuator_commander_node:
  ros__parameters:
    throttle_topic: "/manual/throttle"             # std_msgs/msg/Float32, -1.0 ~ 1.0
    steering_topic: "/manual/steering"             # std_msgs/msg/Float32, -1.0 ~ 1.0
    erpm_topic: "/vesc/erpm"                       # std_msgs/msg/Int32
    servo_position_topic: "/vesc/servo_position"   # std_msgs/msg/Float32

    min_erpm: -5000         # 후진 ERPM 하한
    max_erpm: 8000          # 전진 ERPM 상한
    servo_left: 0.02        # steering -1.0일 때 servo position
    servo_center: 0.50      # steering 0.0일 때 servo position
    servo_right: 0.98      # steering +1.0일 때 servo position
    throttle_deadzone: 0.03
    steering_deadzone: 0.05
